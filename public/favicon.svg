<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Globe circle -->
  <circle cx="16" cy="16" r="14" fill="#0a0a0a" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Latitude lines -->
  <ellipse cx="16" cy="16" rx="14" ry="5.5" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <line x1="2" y1="16" x2="30" y2="16" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <!-- Longitude lines -->
  <ellipse cx="16" cy="16" rx="5.5" ry="14" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="2" x2="16" y2="30" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <!-- Outer glow ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.9"/>
</svg>
